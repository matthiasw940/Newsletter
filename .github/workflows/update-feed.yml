name: Update Newsletter Feeds

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install beautifulsoup4 lxml

      - name: Debug RIS API
        run: |
          curl -s "https://data.bka.gv.at/ris/api/v2.6/Judikatur?Applikation=Justiz&Gericht=OGH&ImRisSeit=ZweiWochen&DokumenteProSeite=OneHundred&Seitennummer=1" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          results=d.get('OgdSearchResult',{}).get('OgdDocumentResults',{})
          if isinstance(results,dict): results=results.get('OgdDocumentReference',[])
          if isinstance(results,dict): results=[results]
          for doc in results[:3]:
              m=doc.get('Data',{}).get('Metadaten',{})
              jud=m.get('Judikatur',{})
              print('=== GZ:', jud.get('Geschaeftszahl',{}))
              print('    Norm:', jud.get('Norm',{}))
              print('    Kurzinfo:', str(jud.get('Kurzinformation',''))[:300])
              print('    Rechtssatz:', str(jud.get('Rechtssatz',''))[:300])
              print('    Justiz keys:', list(jud.get('Justiz',{}).keys()))
              print('    ALL jud keys:', list(jud.keys()))
              print()
          "
