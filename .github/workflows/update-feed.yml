name: Update Newsletter Feeds

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install beautifulsoup4 lxml

      - name: Check fetch_feeds version
        run: head -3 fetch_feeds.py

      - name: Fetch feeds and update data.json
        run: python fetch_feeds.py

      - name: Debug OGH data
        run: |
          python3 -c "
          import json
          with open('data.json') as f: d=json.load(f)
          ogh=d.get('recht_ogh',[])
          print(f'OGH total: {len(ogh)}')
          for a in ogh[:5]:
              print(f'  {a[\"title\"]}')
              print(f'    norm: {a.get(\"norm\",\"MISSING\")}')
              print(f'    excerpt: {a.get(\"excerpt\",\"\")[:200]}')
              print(f'    source: {a[\"source\"]}')
              print()
          "

      - name: Commit and push
        run: |
          git config user.name "Newsletter Bot"
          git config user.email "bot@newsletter.local"
          git add data.json
          git diff --cached --quiet || {
            git commit -m "🗞️ $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          }
